<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Government Schemes Finder — NO POVERTY</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-4 flex-grow-1">
    <div class="row align-items-center mb-4">
      <div class="col-md-8">
        <h2 class="fw-bold text-dark mb-1">Smart Government Scheme Finder</h2>
        <p class="text-muted small mb-0">Search and filter public social protection initiatives across India.</p>
      </div>
      <div class="col-md-4 text-md-end mt-3 mt-md-0">
        <a href="voice-search.html" class="btn btn-outline-danger btn-sm">
          <i class="fa-solid fa-microphone me-1"></i> Speak Your Need (Voice Search)
        </a>
      </div>
    </div>

    <!-- Search & Filter Control Panel -->
    <div class="card border-0 shadow-sm p-3 mb-4 bg-white">
      <div class="row g-2 align-items-center">
        <div class="col-lg-4 col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
            <input type="text" id="search-input" class="form-control form-control-gov border-start-0" placeholder="Search by name, crop, stipend, hospital...">
          </div>
        </div>

        <div class="col-lg-3 col-md-6">
          <select id="cat-filter" class="form-select form-control-gov">
            <option value="ALL">All Welfare Categories</option>
            <option value="student">Students & Youth</option>
            <option value="farmer">Farmers & Agriculture</option>
            <option value="senior_citizen">Senior Citizens</option>
            <option value="employment">Job Seekers & Livelihood</option>
            <option value="housing">Housing & Shelter</option>
            <option value="education">Education Assistance</option>
            <option value="food_assistance">Food Security & Nutrition</option>
            <option value="healthcare">Healthcare & Medical Relief</option>
            <option value="women_children">Women & Children</option>
            <option value="disability">Persons with Disabilities</option>
          </select>
        </div>

        <div class="col-lg-3 col-md-6">
          <select id="state-filter" class="form-select form-control-gov">
            <option value="All India">All India / Pan-India</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Uttar Pradesh">Uttar Pradesh</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Bihar">Bihar</option>
            <option value="Delhi">Delhi</option>
            <option value="West Bengal">West Bengal</option>
            <option value="Rajasthan">Rajasthan</option>
          </select>
        </div>

        <div class="col-lg-2 col-md-6 d-flex gap-2">
          <button class="btn btn-gov-primary w-100 justify-content-center" onclick="applyFilters()">
            <i class="fa-solid fa-filter me-1"></i> Filter
          </button>
          <button class="btn btn-outline-secondary" onclick="SchemeManager.resetFilters()" title="Reset">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Active Filters & Sort -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div id="results-count-text" class="text-muted small fw-semibold">Loading schemes...</div>
      <div class="d-flex align-items-center gap-2">
        <span class="small text-muted">Sort:</span>
        <select id="sort-select" class="form-select form-select-sm" style="width: 170px;" onchange="applySorting()">
          <option value="relevant">Most Relevant</option>
          <option value="popular">Most Popular</option>
          <option value="alpha">Alphabetical (A-Z)</option>
        </select>
      </div>
    </div>

    <!-- Schemes Grid -->
    <div class="row g-4" id="schemes-grid">
      <!-- Injected by SchemeManager.renderSchemeCards -->
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/scheme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const catParam = urlParams.get('cat');
      const qParam = urlParams.get('q');

      if (catParam) document.getElementById('cat-filter').value = catParam;
      if (qParam) document.getElementById('search-input').value = qParam;

      await loadFiltered();
    });

    async function loadFiltered() {
      const keyword = document.getElementById('search-input').value;
      const category = document.getElementById('cat-filter').value;
      const state = document.getElementById('state-filter').value;

      const schemes = await SchemeManager.loadSchemes(keyword, category, state);
      document.getElementById('results-count-text').innerText = `Showing ${schemes.length} welfare scheme(s)`;
      SchemeManager.renderSchemeCards(schemes, 'schemes-grid');
    }

    function applyFilters() {
      loadFiltered();
    }

    function applySorting() {
      const sort = document.getElementById('sort-select').value;
      let sorted = [...SchemeManager.allSchemes];
      if (sort === 'popular') {
        sorted.sort((a, b) => (b.viewsCount || 0) - (a.viewsCount || 0));
      } else if (sort === 'alpha') {
        sorted.sort((a, b) => a.name.localeCompare(b.name));
      }
      SchemeManager.renderSchemeCards(sorted, 'schemes-grid');
    }

    // Auto-search on Enter key
    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') applyFilters();
    });
  </script>
</body>
</html>
