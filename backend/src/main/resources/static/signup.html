<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Citizen Account — NO POVERTY Welfare Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="card border-0 shadow-sm p-4 p-md-5" style="max-width: 680px; width: 100%; border-radius: 16px;">
      <div class="text-center mb-4">
        <div class="brand-emblem mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
          <i class="fa-solid fa-hands-holding-child"></i>
        </div>
        <h3 class="fw-bold text-dark">Register for Welfare Assistance</h3>
        <p class="text-muted small">Create your citizen profile to unlock personalized recommendations and document checklists.</p>
      </div>

      <form id="signup-form">
        <div class="row g-3">
          <div class="col-md-12">
            <label class="form-label-gov">Full Name (as in Aadhaar/Records) *</label>
            <input type="text" id="signup-name" class="form-control form-control-gov" placeholder="e.g. Ramesh Kumar" required>
          </div>

          <div class="col-md-6">
            <label class="form-label-gov">Email Address *</label>
            <input type="email" id="signup-email" class="form-control form-control-gov" placeholder="citizen@example.com" required>
          </div>

          <div class="col-md-6">
            <label class="form-label-gov">Mobile Number (10 Digits) *</label>
            <input type="tel" id="signup-mobile" class="form-control form-control-gov" placeholder="e.g. 9876543210" required>
          </div>

          <div class="col-md-6">
            <label class="form-label-gov">State *</label>
            <select id="signup-state" class="form-select form-control-gov" required>
              <option value="Karnataka">Karnataka</option>
              <option value="Maharashtra">Maharashtra</option>
              <option value="Uttar Pradesh">Uttar Pradesh</option>
              <option value="Tamil Nadu">Tamil Nadu</option>
              <option value="Bihar">Bihar</option>
              <option value="West Bengal">West Bengal</option>
              <option value="Delhi">Delhi</option>
              <option value="Rajasthan">Rajasthan</option>
              <option value="Madhya Pradesh">Madhya Pradesh</option>
              <option value="Gujarat">Gujarat</option>
              <option value="Andhra Pradesh">Andhra Pradesh</option>
              <option value="Telangana">Telangana</option>
              <option value="Kerala">Kerala</option>
              <option value="Other">Other State / UT</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label-gov">District</label>
            <input type="text" id="signup-district" class="form-control form-control-gov" placeholder="e.g. Bengaluru Urban">
          </div>

          <div class="col-md-6">
            <label class="form-label-gov">Date of Birth</label>
            <input type="date" id="signup-dob" class="form-control form-control-gov">
          </div>

          <div class="col-md-6">
            <label class="form-label-gov">User Role</label>
            <select id="signup-role" class="form-select form-control-gov">
              <option value="USER" selected>Citizen / Beneficiary</option>
              <option value="ADMIN">Administrator (Protected)</option>
              <option value="DEVELOPER_ADMIN">Developer Admin (Protected)</option>
            </select>
          </div>

          <div class="col-12 d-none" id="admin-key-group">
            <div class="alert alert-warning p-2 small mb-1">
              <i class="fa-solid fa-lock me-1"></i> Admin accounts are restricted. Enter authorization master key:
            </div>
            <input type="password" id="signup-admin-key" class="form-control form-control-gov" placeholder="Enter Admin Secret Key (Hint: SDG1_SECURE_ADMIN_PASS_2026)">
          </div>

          <div class="col-md-6">
            <label class="form-label-gov">Password *</label>
            <div class="input-group">
              <input type="password" id="signup-password" class="form-control form-control-gov" placeholder="At least 6 characters" minlength="6" required>
              <button type="button" class="btn btn-outline-secondary border" onclick="AuthManager.togglePasswordVisibility('signup-password', 'signup-pass-icon')">
                <i id="signup-pass-icon" class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="strength-meter-bar">
              <div id="strength-bar" class="strength-meter-fill"></div>
            </div>
            <div class="d-flex justify-content-between small text-muted mt-1">
              <span>Strength:</span>
              <span id="strength-text" class="fw-semibold">Too Short</span>
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label-gov">Confirm Password *</label>
            <input type="password" id="signup-confirm-password" class="form-control form-control-gov" placeholder="Re-enter password" required>
          </div>

          <div class="col-12 mt-3">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="signup-terms" required>
              <label class="form-check-label small text-muted" for="signup-terms">
                I understand this platform provides information & guidance aligned with <strong>UN SDG 1</strong>. I agree to the <a href="terms.html" target="_blank">Terms of Service</a> and <a href="privacy.html" target="_blank">Privacy Policy</a>.
              </label>
            </div>
          </div>

          <div class="col-12 mt-4">
            <button type="submit" id="signup-submit-btn" class="btn btn-gov-primary w-100 justify-content-center py-2 fs-6">
              <i class="fa-solid fa-user-check me-1"></i> Complete Registration
            </button>
          </div>
        </div>
      </form>

      <div class="text-center mt-4 pt-3 border-top small">
        Already have an account? <a href="signin.html" class="fw-bold text-primary">Sign In here</a>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AuthManager.initSignup();
    });
  </script>
</body>
</html>
