<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalized Recommendations — NO POVERTY</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <div>
        <span class="badge bg-danger px-3 py-1 mb-1">SDG 1 RECOMMENDATION ENGINE</span>
        <h2 class="fw-bold text-dark mb-1">Recommended for You</h2>
        <p class="text-muted small mb-0">Scored automatically based on your household income, age, occupation, and family dependents.</p>
      </div>
      <div>
        <a href="profile.html" class="btn btn-outline-primary btn-sm">
          <i class="fa-solid fa-user-pen me-1"></i> Update Profile for Better Matches
        </a>
      </div>
    </div>

    <!-- Recommendations Grid -->
    <div class="row g-4" id="recommendations-grid">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted small mt-2">Computing demographic and economic relevance scores...</p>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/scheme.js"></script>
  <script src="assets/js/recommendations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      RecommendationManager.loadRecommendations();
    });
  </script>
</body>
</html>
