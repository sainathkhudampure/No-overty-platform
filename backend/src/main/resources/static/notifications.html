<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Center — NO POVERTY Welfare Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-4 flex-grow-1" style="max-width: 860px;">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-bell text-warning me-2"></i> Citizen Notifications</h3>
        <p class="text-muted small mb-0">Application milestones, deadline reminders, and new welfare initiatives.</p>
      </div>
      <button class="btn btn-outline-secondary btn-sm" onclick="markAllNotificationsRead()">
        <i class="fa-solid fa-check-double me-1"></i> Mark All as Read
      </button>
    </div>

    <!-- Notification Feed -->
    <div class="card border-0 shadow-sm p-4 bg-white">
      <div id="notifications-feed" class="d-flex flex-column gap-3">
        <div class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2"></div> Loading alerts...</div>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadNotifications();
    });

    async function loadNotifications() {
      const res = await API.get('/notifications');
      const feed = document.getElementById('notifications-feed');
      const list = res && res.data ? res.data : [];

      if (list.length === 0) {
        feed.innerHTML = `
          <div class="text-center py-5 text-muted">
            <i class="fa-regular fa-bell-slash fs-1 mb-2"></i>
            <p>No new notifications at this time.</p>
          </div>
        `;
        return;
      }

      feed.innerHTML = list.map(n => {
        const icon = n.type === 'ALERT' ? 'fa-triangle-exclamation text-danger' : n.type === 'SCHEME' ? 'fa-gift text-success' : 'fa-info-circle text-primary';
        const unreadClass = n.isRead ? 'opacity-75' : 'border-start border-3 border-primary bg-light';

        return `
          <div class="p-3 border rounded-3 ${unreadClass} d-flex justify-content-between align-items-start gap-3">
            <div class="d-flex align-items-start gap-3">
              <i class="fa-solid ${icon} fs-5 mt-1"></i>
              <div>
                <div class="d-flex align-items-center gap-2 mb-1">
                  <h6 class="fw-bold mb-0 text-dark">${n.title}</h6>
                  ${!n.isRead ? '<span class="badge bg-danger rounded-pill" style="font-size: 0.65rem;">NEW</span>' : ''}
                </div>
                <p class="text-secondary small mb-1">${n.message}</p>
                <div class="small text-muted" style="font-size: 0.72rem;">${n.createdAt ? new Date(n.createdAt).toLocaleDateString() : 'Recent'}</div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-2">
              ${n.linkUrl ? `<a href="${n.linkUrl}" class="btn btn-sm btn-outline-primary py-1 px-2">View</a>` : ''}
              ${!n.isRead ? `<button class="btn btn-sm btn-link text-muted p-0" title="Mark Read" onclick="markRead(${n.id})"><i class="fa-solid fa-check"></i></button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function markRead(id) {
      await API.put(`/notifications/${id}/read`, {});
      loadNotifications();
    }

    async function markAllNotificationsRead() {
      await API.put('/notifications/read-all', {});
      App.showToast('All notifications marked as read', 'info');
      loadNotifications();
    }
  </script>
</body>
</html>
