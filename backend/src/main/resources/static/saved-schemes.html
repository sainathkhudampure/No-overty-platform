<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Schemes — NO POVERTY Welfare Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <div>
        <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-bookmark text-danger me-2"></i> My Bookmarked Welfare Schemes</h3>
        <p class="text-muted small mb-0">Saved schemes for future reference, document readiness, and official portal application.</p>
      </div>
      <a href="scheme-finder.html" class="btn btn-outline-primary btn-sm">
        <i class="fa-solid fa-plus me-1"></i> Browse More Schemes
      </a>
    </div>

    <!-- Schemes Container -->
    <div class="row g-4" id="saved-schemes-container">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted small mt-2">Loading saved bookmarks...</p>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      loadSaved();
    });

    async function loadSaved() {
      const res = await API.get('/saved-schemes');
      const container = document.getElementById('saved-schemes-container');
      const list = res && res.data ? res.data : [];

      if (list.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="fa-regular fa-bookmark fs-1 text-muted mb-3"></i>
            <h5 class="fw-bold">No Saved Schemes Yet</h5>
            <p class="text-muted small">When browsing schemes in the Scheme Finder, click the bookmark icon to save them here.</p>
            <a href="scheme-finder.html" class="btn btn-primary btn-sm">Discover Schemes</a>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(s => `
        <div class="col-lg-4 col-md-6">
          <div class="scheme-card bg-white">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <span class="badge bg-light text-primary border">${s.categories?.[0]?.name || 'Welfare'}</span>
              <button class="btn btn-sm btn-link text-danger p-0" title="Remove Bookmark" onclick="removeSaved(${s.id})">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
            <div class="scheme-dept-tag">${s.department}</div>
            <h5 class="scheme-title">${s.name}</h5>
            <p class="text-muted small flex-grow-1">${s.shortDescription}</p>
            <div class="scheme-benefit-box">
              <div class="small text-muted"><i class="fa-solid fa-gift me-1"></i> Benefits:</div>
              <div class="fw-bold text-dark">${s.benefits?.substring(0, 95)}...</div>
            </div>
            <div class="scheme-footer">
              <a href="scheme-details.html?id=${s.id}" class="btn btn-sm btn-outline-primary">Details</a>
              <a href="eligibility.html?schemeId=${s.id}" class="btn btn-sm btn-gov-primary py-1 px-3">Check Eligibility</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function removeSaved(id) {
      if (!confirm('Remove this scheme from your saved bookmarks?')) return;
      await API.delete(`/saved-schemes/${id}`);
      App.showToast('Bookmark removed.', 'info');
      loadSaved();
    }
  </script>
</body>
</html>
