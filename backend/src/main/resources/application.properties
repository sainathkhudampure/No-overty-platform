# ====================================================================
# NO POVERTY Welfare Platform - Spring Boot Application Configuration
# UN SDG 1: NO POVERTY
# ====================================================================

spring.application.name=no-poverty-platform
server.port=8085

# Default profile uses H2 for instant local plug-and-play testing
# To use MySQL 8.0, run with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:no_poverty_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8085/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security JWT configuration
app.jwt.secret=9a4f2c8d7e1b5a3f8c2e6d9b1a4f7e2c5d8a1b4e7c0f3a6d9b2e5a8c1f4d7b0e
app.jwt.expiration-ms=86400000

# File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Serve Static Web Resources
spring.web.resources.static-locations=classpath:/static/,file:./frontend/

