# ====================================================================
# MySQL 8.0+ Production / Local Server Configuration
# Activate via: java -jar app.jar --spring.profiles.active=mysql
# Or in environment: SPRING_PROFILES_ACTIVE=mysql
# ====================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/no_poverty_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f8c2e6d9b1a4f7e2c5d8a1b4e7c0f3a6d9b2e5a8c1f4d7b0e}
app.jwt.expiration-ms=86400000

