<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories — Admin Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-1 small">
            <li class="breadcrumb-item"><a href="admin-dashboard.html">Admin</a></li>
            <li class="breadcrumb-item active">Beneficiary Categories</li>
          </ol>
        </nav>
        <h3 class="fw-bold text-dark mb-0">Welfare Beneficiary Categories</h3>
      </div>
    </div>

    <div class="card border-0 shadow-sm p-4 bg-white">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Code</th>
              <th>Category Name</th>
              <th>Description</th>
              <th>Icon Class</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="categories-tbody">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const res = await API.get('/categories');
      const tbody = document.getElementById('categories-tbody');
      const list = res && res.data ? res.data : [];

      tbody.innerHTML = list.map(c => `
        <tr>
          <td class="fw-bold font-monospace">${c.code}</td>
          <td><i class="${c.icon} text-primary me-2"></i><strong>${c.name}</strong></td>
          <td class="small text-muted">${c.description || ''}</td>
          <td><code>${c.icon}</code></td>
          <td><span class="badge bg-success">Active</span></td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
