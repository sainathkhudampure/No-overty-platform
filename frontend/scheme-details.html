<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheme Details — NO POVERTY Welfare Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-4 flex-grow-1">
    <!-- Breadcrumb & Audio Toolbar -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0 small">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item"><a href="scheme-finder.html">Schemes</a></li>
          <li class="breadcrumb-item active" id="breadcrumb-scheme-name">Details</li>
        </ol>
      </nav>

      <!-- Text-to-Speech Toolbar -->
      <div class="d-flex align-items-center gap-2 bg-white p-2 rounded-3 border shadow-sm">
        <span class="small fw-semibold text-muted me-1"><i class="fa-solid fa-volume-high text-primary"></i> Audio:</span>
        <button id="tts-play-btn" class="btn btn-sm btn-outline-primary py-1 px-2" onclick="readSchemeAloud()">
          <i class="fa-solid fa-play me-1"></i> Read Aloud
        </button>
        <button id="tts-pause-btn" class="btn btn-sm btn-outline-warning py-1 px-2 d-none" onclick="SpeechManager.pauseTTS()">
          <i class="fa-solid fa-pause me-1"></i> Pause
        </button>
        <button id="tts-stop-btn" class="btn btn-sm btn-outline-danger py-1 px-2 d-none" onclick="SpeechManager.stopTTS()">
          <i class="fa-solid fa-stop me-1"></i> Stop
        </button>
      </div>
    </div>

    <!-- Main Content Container -->
    <div class="row g-4" id="scheme-details-container">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted small mt-2">Loading verified government scheme guidelines...</p>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/speech.js"></script>
  <script src="assets/js/scheme.js"></script>
  <script>
    let currentScheme = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id') || '1';

      currentScheme = await SchemeManager.loadSchemeDetails(id);
      renderDetails(currentScheme);
    });

    function renderDetails(s) {
      if (!s) {
        document.getElementById('scheme-details-container').innerHTML = `
          <div class="col-12 text-center py-5 text-danger">
            <h5>Scheme Not Found</h5>
            <a href="scheme-finder.html" class="btn btn-primary mt-2">Back to Scheme Finder</a>
          </div>
        `;
        return;
      }

      document.getElementById('breadcrumb-scheme-name').innerText = s.name;

      const catBadge = s.categories && s.categories.length > 0 ? s.categories[0].name : 'Welfare';
      const crit = s.eligibilityCriteria || {};
      const docs = s.documents || [];

      document.getElementById('scheme-details-container').innerHTML = `
        <!-- Left Column: Details -->
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm p-4 p-md-5 mb-4 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="badge bg-light text-primary border">${catBadge}</span>
              <span class="badge bg-success-subtle text-success border border-success">${s.stateAvailability || 'All India'}</span>
            </div>
            <div class="text-muted small text-uppercase fw-semibold mb-1">${s.department || 'Government of India'}</div>
            <h2 class="fw-bold text-dark mb-3">${s.name}</h2>
            <p class="lead text-secondary fs-6 mb-4">${s.fullDescription || s.shortDescription}</p>

            <div class="p-3 bg-light rounded-3 border-start border-4 border-success mb-4">
              <h6 class="fw-bold text-success mb-1"><i class="fa-solid fa-gift me-1"></i> Key Entitlement & Financial Benefits</h6>
              <div class="text-dark">${s.benefits || 'Direct Benefit Transfer support.'}</div>
            </div>

            <h5 class="fw-bold text-dark mb-2 mt-4"><i class="fa-solid fa-bullseye text-primary me-2"></i> Objective</h5>
            <p class="text-muted">${s.objective || 'To empower underprivileged citizens through social protection.'}</p>

            <h5 class="fw-bold text-dark mb-2 mt-4"><i class="fa-solid fa-list-check text-primary me-2"></i> Eligibility Conditions</h5>
            <div class="p-3 bg-light rounded-3 mb-4">
              <p class="mb-2 text-dark">${crit.criteriaDescription || 'Universal eligibility subject to demographic criteria.'}</p>
              <ul class="list-unstyled small mb-0 text-muted">
                <li>• <strong>Age Range:</strong> ${crit.minAge || 0} to ${crit.maxAge || 100} Years</li>
                <li>• <strong>Gender:</strong> ${crit.requiredGender || 'ALL'}</li>
                <li>• <strong>Income Ceiling:</strong> Up to ₹${crit.maxIncome ? crit.maxIncome.toLocaleString('en-IN') : 'N/A'}/year</li>
                <li>• <strong>Residency:</strong> ${crit.allowedStates || 'All India'}</li>
              </ul>
            </div>

            <h5 class="fw-bold text-dark mb-2 mt-4"><i class="fa-solid fa-diagram-project text-primary me-2"></i> Step-by-Step Application Guidance</h5>
            <div class="p-3 bg-light rounded-3 mb-4 small text-secondary" style="white-space: pre-line;">
              ${s.applicationProcess || 'Apply online at official portal.'}
            </div>

            <div class="alert alert-secondary small mb-0">
              <i class="fa-solid fa-scale-balanced me-1"></i> <strong>Official Source Attribution:</strong>
              This informational summary is compiled from official public portals (${s.department}). Applications are processed strictly on official Government of India websites.
            </div>
          </div>
        </div>

        <!-- Right Column: Required Documents & Action Links -->
        <div class="col-lg-4">
          <!-- Action Buttons Card -->
          <div class="card border-0 shadow-sm p-4 mb-4 bg-white">
            <h6 class="fw-bold text-dark mb-3">Official Application Actions</h6>
            
            <a href="${s.officialApplicationUrl || s.officialPortalUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-gov-primary w-100 justify-content-center py-2 mb-2">
              <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Apply on Official Portal
            </a>
            <div class="text-center small text-muted mb-3" style="font-size: 0.75rem;">
              Opens official portal: <code>${new URL(s.officialPortalUrl).hostname}</code>
            </div>

            <a href="eligibility.html?schemeId=${s.id}" class="btn btn-outline-success w-100 py-2 mb-2">
              <i class="fa-solid fa-clipboard-check me-1"></i> Check My Eligibility
            </a>

            <button class="btn btn-outline-secondary w-100 py-2 mb-2" onclick="SchemeManager.toggleSaveScheme(${s.id}, this)">
              <i class="fa-regular fa-bookmark me-1"></i> Save to My Profile
            </button>

            <a href="scheme-compare.html?id1=${s.id}" class="btn btn-outline-secondary w-100 py-2">
              <i class="fa-solid fa-code-compare me-1"></i> Compare with Another
            </a>
          </div>

          <!-- Document Checklist Card -->
          <div class="card border-0 shadow-sm p-4 bg-white">
            <h6 class="fw-bold text-dark mb-3"><i class="fa-solid fa-folder-open text-info me-2"></i> Required Documents</h6>
            <ul class="list-unstyled mb-0">
              ${docs.map(d => `
                <li class="p-2 border-bottom d-flex align-items-start gap-2">
                  <i class="fa-solid fa-file-lines text-primary mt-1"></i>
                  <div>
                    <div class="fw-semibold text-dark small">${d.documentName} ${d.isMandatory ? '<span class="text-danger">*</span>' : ''}</div>
                    ${d.description ? `<div class="text-muted" style="font-size: 0.72rem;">${d.description}</div>` : ''}
                  </div>
                </li>
              `).join('')}
            </ul>
            <a href="documents.html" class="btn btn-light btn-sm w-100 mt-3 border">
              <i class="fa-solid fa-list-check me-1"></i> Open Document Vault
            </a>
          </div>
        </div>
      `;
    }

    function readSchemeAloud() {
      if (!currentScheme) return;
      const text = `${currentScheme.name}. ${currentScheme.shortDescription}. Benefits: ${currentScheme.benefits}. Eligibility: ${currentScheme.eligibilityCriteria?.criteriaDescription || 'Review official criteria.'}`;
      SpeechManager.readAloud(text);
    }
  </script>
</body>
</html>
