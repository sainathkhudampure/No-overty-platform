<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Welfare Assistant — NO POVERTY</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-4 flex-grow-1" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="fw-bold text-dark mb-0"><i class="fa-solid fa-robot text-primary me-2"></i> AI Welfare Assistant</h3>
        <p class="text-muted small mb-0">Ask questions regarding eligibility, documents, or benefits in plain English or local terms.</p>
      </div>
      <span class="badge bg-danger">SDG 1 AI</span>
    </div>

    <!-- Suggested Quick Prompts -->
    <div class="mb-3 d-flex flex-wrap gap-2">
      <button class="btn btn-sm btn-outline-secondary rounded-pill bg-white" onclick="Chatbot.sendQuickQuery('What schemes are available for students?')">
        🎓 Schemes for students?
      </button>
      <button class="btn btn-sm btn-outline-secondary rounded-pill bg-white" onclick="Chatbot.sendQuickQuery('I am a farmer. What support can I get?')">
        🌾 Farmer support schemes?
      </button>
      <button class="btn btn-sm btn-outline-secondary rounded-pill bg-white" onclick="Chatbot.sendQuickQuery('Which documents are required for PM-KISAN?')">
        📄 PM-KISAN documents?
      </button>
      <button class="btn btn-sm btn-outline-secondary rounded-pill bg-white" onclick="Chatbot.sendQuickQuery('How do I apply for Ayushman Bharat?')">
        🏥 Ayushman Bharat application?
      </button>
      <button class="btn btn-sm btn-outline-secondary rounded-pill bg-white" onclick="Chatbot.sendQuickQuery('Pensions for senior citizens')">
        👴 Senior citizen pensions?
      </button>
    </div>

    <!-- Chat Box -->
    <div class="chat-window">
      <!-- Message Stream -->
      <div class="chat-messages" id="chat-messages">
        <!-- Rendered by Chatbot.js -->
      </div>

      <!-- Chat Input Field -->
      <div class="p-3 border-top bg-white">
        <form id="chat-form" onsubmit="event.preventDefault(); const inp = document.getElementById('chat-input'); Chatbot.ask(inp.value); inp.value = '';">
          <div class="input-group">
            <input type="text" id="chat-input" class="form-control form-control-gov" placeholder="Type your query (e.g. Can I get a loan for street vending?)..." required>
            <button class="btn btn-gov-primary px-4" type="submit">
              <i class="fa-solid fa-paper-plane me-1"></i> Send
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/chatbot.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Chatbot.init();
    });
  </script>
</body>
</html>
