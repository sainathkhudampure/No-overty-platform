<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NO POVERTY Welfare Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="card border-0 shadow-sm p-4 p-md-5" style="max-width: 480px; width: 100%; border-radius: 16px;">
      <div class="text-center mb-4">
        <div class="brand-emblem mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
          <i class="fa-solid fa-key"></i>
        </div>
        <h3 class="fw-bold text-dark">Password Recovery</h3>
        <p class="text-muted small">Enter your registered email address or mobile number to receive a secure recovery code or OTP.</p>
      </div>

      <form id="forgot-form" onsubmit="event.preventDefault(); document.getElementById('reset-alert').classList.remove('d-none');">
        <div class="mb-4">
          <label class="form-label-gov">Registered Email or Mobile</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
            <input type="text" class="form-control form-control-gov border-start-0" placeholder="citizen@example.com" required>
          </div>
        </div>

        <button type="submit" class="btn btn-gov-primary w-100 justify-content-center py-2 fs-6">
          <i class="fa-solid fa-paper-plane me-1"></i> Send Verification Link / OTP
        </button>

        <div id="reset-alert" class="alert alert-success mt-4 d-none small">
          <i class="fa-solid fa-circle-check me-1"></i> If an account exists with this credential, a verification link has been dispatched to your email/SMS.
        </div>
      </form>

      <div class="text-center mt-4 pt-3 border-top small">
        Remembered your password? <a href="signin.html" class="fw-bold text-primary">Back to Sign In</a>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
