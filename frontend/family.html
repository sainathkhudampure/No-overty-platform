<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Welfare Profile — NO POVERTY Welfare Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <div>
        <h3 class="fw-bold text-dark mb-1">Household & Family Welfare Profile</h3>
        <p class="text-muted small mb-0">Record household dependents to discover family scholarships, housing quotas, and elder care benefits.</p>
      </div>
      <button class="btn btn-gov-primary" data-bs-toggle="modal" data-bs-target="#addMemberModal">
        <i class="fa-solid fa-user-plus me-1"></i> Add Family Member
      </button>
    </div>

    <!-- Overview Statistics -->
    <div class="card border-0 shadow-sm p-4 mb-4 bg-white" id="family-overview-box">
      <!-- Injected by FamilyManager.renderOverview -->
    </div>

    <!-- Members List -->
    <div class="card border-0 shadow-sm p-4 bg-white">
      <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-people-roof text-primary me-2"></i> Registered Family Members</h5>
      <div id="family-members-list">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <!-- Add Member Modal -->
  <div class="modal fade" id="addMemberModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Add Family Dependent</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="add-member-form">
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label-gov">Full Name *</label>
                <input type="text" id="fm-name" class="form-control form-control-gov" placeholder="e.g. Parvathi Kumar" required>
              </div>
              <div class="col-md-6">
                <label class="form-label-gov">Relationship *</label>
                <select id="fm-rel" class="form-select form-control-gov" required>
                  <option value="SPOUSE">Spouse</option>
                  <option value="SON">Son</option>
                  <option value="DAUGHTER">Daughter</option>
                  <option value="FATHER">Father</option>
                  <option value="MOTHER">Mother</option>
                  <option value="BROTHER">Brother</option>
                  <option value="SISTER">Sister</option>
                  <option value="OTHER">Other Dependent</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label-gov">Age (Years) *</label>
                <input type="number" id="fm-age" class="form-control form-control-gov" placeholder="18" required>
              </div>
              <div class="col-md-6">
                <label class="form-label-gov">Gender</label>
                <select id="fm-gender" class="form-select form-control-gov">
                  <option value="MALE">Male</option>
                  <option value="FEMALE">Female</option>
                  <option value="OTHER">Other</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label-gov">Occupation</label>
                <input type="text" id="fm-occ" class="form-control form-control-gov" placeholder="Student, Retired, Homemaker">
              </div>
              <div class="col-12">
                <div class="form-check form-switch mb-2">
                  <input class="form-check-input" type="checkbox" id="fm-is-student">
                  <label class="form-check-label small" for="fm-is-student">Currently Enrolled Student</label>
                </div>
                <div class="form-check form-switch mb-2">
                  <input class="form-check-input" type="checkbox" id="fm-is-senior">
                  <label class="form-check-label small" for="fm-is-senior">Senior Citizen (60+ years)</label>
                </div>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="fm-is-disability">
                  <label class="form-check-label small" for="fm-is-disability">Person with Disability (Divyangjan)</label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-gov-primary">Save Member</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/family.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FamilyManager.loadFamily();

      document.getElementById('add-member-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          name: document.getElementById('fm-name').value.trim(),
          relationship: document.getElementById('fm-rel').value,
          age: parseInt(document.getElementById('fm-age').value),
          gender: document.getElementById('fm-gender').value,
          occupation: document.getElementById('fm-occ').value.trim(),
          studentStatus: document.getElementById('fm-is-student').checked,
          seniorCitizenStatus: document.getElementById('fm-is-senior').checked,
          disabilityStatus: document.getElementById('fm-is-disability').checked
        };

        const res = await API.post('/family', payload);
        if (res && res.success) {
          App.showToast('Family member added to profile!', 'success');
          bootstrap.Modal.getInstance(document.getElementById('addMemberModal')).hide();
          e.target.reset();
          FamilyManager.loadFamily();
        }
      });
    });
  </script>
</body>
</html>
