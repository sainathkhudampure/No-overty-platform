<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applications Review — Admin Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-1 small">
            <li class="breadcrumb-item"><a href="admin-dashboard.html">Admin</a></li>
            <li class="breadcrumb-item active">Applications Review</li>
          </ol>
        </nav>
        <h3 class="fw-bold text-dark mb-0">Citizen Tracked Applications Overview</h3>
      </div>
    </div>

    <div class="card border-0 shadow-sm p-4 bg-white">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>App Number</th>
              <th>Scheme</th>
              <th>Applied Date</th>
              <th>Milestone Status</th>
              <th>Officer Notes</th>
              <th class="text-end">Update Status</th>
            </tr>
          </thead>
          <tbody id="admin-apps-tbody">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      loadAllApps();
    });

    async function loadAllApps() {
      const res = await API.get('/admin/applications');
      const tbody = document.getElementById('admin-apps-tbody');
      const list = res && res.data ? res.data : [];

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No applications found.</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(a => `
        <tr>
          <td class="fw-bold font-monospace">${a.applicationNumber}</td>
          <td>${a.scheme?.name || 'Welfare Scheme'}</td>
          <td>${a.appliedDate || 'N/A'}</td>
          <td>
            <span class="badge ${a.status === 'Approved' ? 'bg-success' : a.status === 'Rejected' ? 'bg-danger' : 'bg-warning text-dark'}">
              ${a.status}
            </span>
          </td>
          <td class="small text-muted">${a.notes || 'None'}</td>
          <td class="text-end">
            <select class="form-select form-select-sm d-inline-block" style="width: 140px;" onchange="updateStatus(${a.id}, this.value)">
              <option value="Draft" ${a.status === 'Draft' ? 'selected' : ''}>Draft</option>
              <option value="Submitted" ${a.status === 'Submitted' ? 'selected' : ''}>Submitted</option>
              <option value="Under Verification" ${a.status === 'Under Verification' ? 'selected' : ''}>Verifying</option>
              <option value="Approved" ${a.status === 'Approved' ? 'selected' : ''}>Approved</option>
              <option value="Benefit Received" ${a.status === 'Benefit Received' ? 'selected' : ''}>Benefit Paid</option>
              <option value="Rejected" ${a.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
            </select>
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(id, newStatus) {
      await API.put(`/admin/applications/${id}/status`, { status: newStatus });
      App.showToast(`Application milestone status set to ${newStatus}`, 'success');
      loadAllApps();
    }
  </script>
</body>
</html>
