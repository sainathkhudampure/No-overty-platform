<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadcast Notifications — Admin Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-4 flex-grow-1" style="max-width: 860px;">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-1 small">
            <li class="breadcrumb-item"><a href="admin-dashboard.html">Admin</a></li>
            <li class="breadcrumb-item active">Broadcast Notifications</li>
          </ol>
        </nav>
        <h3 class="fw-bold text-dark mb-0">System-Wide Broadcast Alerts</h3>
      </div>
    </div>

    <div class="card border-0 shadow-sm p-4 p-md-5 bg-white">
      <form id="broadcast-form" onsubmit="handleSendBroadcast(event)">
        <div class="mb-3">
          <label class="form-label-gov">Alert Subject / Title *</label>
          <input type="text" id="bc-title" class="form-control form-control-gov" placeholder="e.g. National Scholarship Portal Deadline Extended" required>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label-gov">Alert Category</label>
            <select id="bc-type" class="form-select form-control-gov">
              <option value="INFO">General Information (INFO)</option>
              <option value="ALERT">Urgent Action Alert (ALERT)</option>
              <option value="DEADLINE">Deadline Notice (DEADLINE)</option>
              <option value="SCHEME">New Scheme Announcement (SCHEME)</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label-gov">Priority Level</label>
            <select id="bc-priority" class="form-select form-control-gov">
              <option value="NORMAL">Normal Priority</option>
              <option value="HIGH">High Priority</option>
              <option value="URGENT">Urgent / Critical</option>
            </select>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label-gov">Detailed Announcement Body *</label>
          <textarea id="bc-msg" class="form-control form-control-gov" rows="4" placeholder="Enter clear instructions for citizen awareness..." required></textarea>
        </div>
        <button type="submit" class="btn btn-gov-primary px-4 py-2">
          <i class="fa-solid fa-bullhorn me-1"></i> Send Broadcast to All Users
        </button>
      </form>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    async function handleSendBroadcast(e) {
      e.preventDefault();
      const payload = {
        title: document.getElementById('bc-title').value.trim(),
        type: document.getElementById('bc-type').value,
        priority: document.getElementById('bc-priority').value,
        message: document.getElementById('bc-msg').value.trim()
      };

      const res = await API.post('/admin/notifications/broadcast', payload);
      if (res && res.success) {
        App.showToast('Broadcast dispatched to all registered citizens!', 'success');
        e.target.reset();
      }
    }
  </script>
</body>
</html>
