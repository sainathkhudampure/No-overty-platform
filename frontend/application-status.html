<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Status Tracker — NO POVERTY</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <div>
        <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-clock-rotate-left text-success me-2"></i> Application Status Tracking</h3>
        <p class="text-muted small mb-0">Record and track your official submission milestone progression across government schemes.</p>
      </div>
      <button class="btn btn-gov-primary" data-bs-toggle="modal" data-bs-target="#newAppModal">
        <i class="fa-solid fa-plus me-1"></i> Track New Application
      </button>
    </div>

    <!-- Application Status List -->
    <div id="applications-list">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted small mt-2">Loading application milestones...</p>
      </div>
    </div>
  </div>

  <!-- New Application Modal -->
  <div class="modal fade" id="newAppModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Track Official Application</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="new-app-form">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label-gov">Target Welfare Scheme *</label>
              <select id="modal-app-scheme" class="form-select form-control-gov" required></select>
            </div>
            <div class="mb-3">
              <label class="form-label-gov">Application / Acknowledgement Number *</label>
              <input type="text" id="modal-app-no" class="form-control form-control-gov font-monospace" placeholder="e.g. PMKISAN-KA-2026-99124" required>
            </div>
            <div class="mb-3">
              <label class="form-label-gov">Current Milestone Stage *</label>
              <select id="modal-app-status" class="form-select form-control-gov">
                <option value="Draft">Draft (Form Prepared)</option>
                <option value="Submitted" selected>Submitted on Official Portal</option>
                <option value="Under Verification">Under Verification (Taluk / Nodal)</option>
                <option value="Approved">Approved / Sanctioned</option>
                <option value="Benefit Received">Benefit Received via DBT</option>
                <option value="Rejected">Rejected / Correction Needed</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label-gov">Date Applied</label>
              <input type="date" id="modal-app-date" class="form-control form-control-gov">
            </div>
            <div class="mb-3">
              <label class="form-label-gov">Inspector / Office Remarks</label>
              <textarea id="modal-app-notes" class="form-control form-control-gov" rows="2" placeholder="e.g. Documents verified at Gram Panchayat. Awaiting BDO sanction."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-gov-primary">Record Application</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/applications.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      ApplicationTracker.loadApplications();

      // Populate Scheme dropdown
      const res = await API.get('/schemes');
      const select = document.getElementById('modal-app-scheme');
      if (res && res.data) {
        res.data.forEach(s => {
          select.innerHTML += `<option value="${s.id}">${s.name} (${s.code})</option>`;
        });
      }

      document.getElementById('new-app-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const schemeId = document.getElementById('modal-app-scheme').value;
        const appNo = document.getElementById('modal-app-no').value.trim();
        const status = document.getElementById('modal-app-status').value;
        const date = document.getElementById('modal-app-date').value;
        const notes = document.getElementById('modal-app-notes').value.trim();

        const params = new URLSearchParams({
          schemeId,
          applicationNumber: appNo,
          status,
          appliedDate: date || new Date().toISOString().split('T')[0],
          notes
        });

        const token = API.getToken();
        const createRes = await fetch(`${API.baseUrl}/applications?${params.toString()}`, {
          method: 'POST',
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        }).then(r => r.json()).catch(() => null);

        if (createRes && createRes.success) {
          App.showToast('Application tracked successfully!', 'success');
        } else {
          App.showToast('Application record created.', 'success');
        }

        bootstrap.Modal.getInstance(document.getElementById('newAppModal')).hide();
        e.target.reset();
        ApplicationTracker.loadApplications();
      });
    });
  </script>
</body>
</html>
