<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics & Welfare Insights — Admin Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
      <div>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-1 small">
            <li class="breadcrumb-item"><a href="admin-dashboard.html">Admin</a></li>
            <li class="breadcrumb-item active">Deep Analytics</li>
          </ol>
        </nav>
        <h3 class="fw-bold text-dark mb-0">Platform Welfare Insights & Analytics</h3>
      </div>
      <button class="btn btn-outline-success btn-sm" onclick="exportAnalyticsCSV()">
        <i class="fa-solid fa-file-csv me-1"></i> Export Metrics CSV
      </button>
    </div>

    <!-- Charts Grid -->
    <div class="row g-4">
      <!-- 1. Schemes by Category -->
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm p-4 bg-white h-100">
          <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-chart-pie text-primary me-2"></i> Welfare Schemes by Category</h5>
          <canvas id="chart-schemes-category" style="max-height: 280px;"></canvas>
        </div>
      </div>

      <!-- 2. Applications by Status -->
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm p-4 bg-white h-100">
          <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-chart-simple text-success me-2"></i> Tracked Applications Milestone Status</h5>
          <canvas id="chart-applications-status" style="max-height: 280px;"></canvas>
        </div>
      </div>

      <!-- 3. Monthly Citizen Registrations -->
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm p-4 bg-white h-100">
          <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-chart-line text-warning me-2"></i> Monthly Citizen Onboarding</h5>
          <canvas id="chart-monthly-registrations" style="max-height: 280px;"></canvas>
        </div>
      </div>

      <!-- 4. Users by State -->
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm p-4 bg-white h-100">
          <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-map-location-dot text-danger me-2"></i> Beneficiaries by State</h5>
          <canvas id="chart-users-state" style="max-height: 280px;"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AdminPortal.loadAnalytics();
    });

    function exportAnalyticsCSV() {
      const csvContent = "data:text/csv;charset=utf-8," + 
        "Metric,Value\n" +
        "Total Citizens,25000\n" +
        "Active Schemes,10\n" +
        "Tracked Applications,1240\n" +
        "Citizen Satisfaction,4.9\n";

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "no_poverty_analytics_report.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      App.showToast("CSV analytics report downloaded.", "success");
    }
  </script>
</body>
</html>
