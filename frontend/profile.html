<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Profile — NO POVERTY Welfare Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div id="app-navbar"></div>

  <div class="container my-4 flex-grow-1">
    <div class="row g-4">
      <!-- Profile Header & Completion Meter -->
      <div class="col-12">
        <div class="card border-0 shadow-sm p-4 bg-white">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
              <h3 class="fw-bold text-dark mb-1">Citizen Welfare Profile</h3>
              <p class="text-muted small mb-0">Accurate socio-economic details maximize recommendation accuracy and welfare matching.</p>
            </div>
            <div class="text-end">
              <div class="text-muted small fw-semibold">Profile Completion</div>
              <div class="fs-4 fw-bold text-primary" id="prof-completion-text">85%</div>
              <div class="progress mt-1" style="width: 140px; height: 6px;">
                <div id="prof-completion-bar" class="progress-bar bg-primary" style="width: 85%;"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Profile Form -->
      <div class="col-12">
        <form id="profile-form">
          <!-- 1. Personal Information -->
          <div class="card border-0 shadow-sm p-4 mb-4">
            <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">
              <i class="fa-solid fa-user text-primary me-2"></i> 1. Personal Information
            </h5>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label-gov">Full Name</label>
                <input type="text" id="prof-name" class="form-control form-control-gov" readonly>
              </div>
              <div class="col-md-4">
                <label class="form-label-gov">Email Address</label>
                <input type="email" id="prof-email" class="form-control form-control-gov" readonly>
              </div>
              <div class="col-md-4">
                <label class="form-label-gov">Mobile Number</label>
                <input type="text" id="prof-mobile" class="form-control form-control-gov" readonly>
              </div>
              <div class="col-md-4">
                <label class="form-label-gov">Gender</label>
                <select id="prof-gender" class="form-select form-control-gov">
                  <option value="MALE">Male</option>
                  <option value="FEMALE">Female</option>
                  <option value="TRANSGENDER">Transgender / Other</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label-gov">Residential Area Type</label>
                <select id="prof-area" class="form-select form-control-gov">
                  <option value="RURAL">Rural (Village / Gram Panchayat)</option>
                  <option value="URBAN">Urban (Municipality / City)</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label-gov">PIN Code</label>
                <input type="text" id="prof-pincode" class="form-control form-control-gov" placeholder="560060" maxlength="6">
              </div>
              <div class="col-12">
                <label class="form-label-gov">Permanent Address / Village</label>
                <input type="text" id="prof-address" class="form-control form-control-gov" placeholder="House no, Street, Village">
              </div>
            </div>
          </div>

          <!-- 2. Economic & Household Information -->
          <div class="card border-0 shadow-sm p-4 mb-4">
            <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">
              <i class="fa-solid fa-coins text-warning me-2"></i> 2. Economic & Household Status
            </h5>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label-gov">Annual Family Income (₹) *</label>
                <input type="number" id="prof-income" class="form-control form-control-gov" placeholder="120000" required>
              </div>
              <div class="col-md-4">
                <label class="form-label-gov">Primary Employment Status</label>
                <select id="prof-employment" class="form-select form-control-gov">
                  <option value="SELF_EMPLOYED">Self Employed / Daily Wage</option>
                  <option value="UNEMPLOYED">Unemployed / Job Seeker</option>
                  <option value="FARMER">Agricultural Farmer / Laborer</option>
                  <option value="PRIVATE">Salaried (Private)</option>
                  <option value="STUDENT">Full-time Student</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label-gov">Family Size (Members)</label>
                <input type="number" id="prof-family-size" class="form-control form-control-gov" value="4">
              </div>
              <div class="col-md-6">
                <label class="form-label-gov">House Ownership Status</label>
                <select id="prof-house" class="form-select form-control-gov">
                  <option value="OWNED_KUTCHA">Owned Kutcha / Dilapidated House</option>
                  <option value="OWNED_PUCCA">Owned Pucca House</option>
                  <option value="RENTED">Rented Accommodation</option>
                  <option value="HOMELESS">Houseless / Kutcha Roof</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 3. Education & Category Status -->
          <div class="card border-0 shadow-sm p-4 mb-4">
            <h5 class="fw-bold text-dark border-bottom pb-2 mb-3">
              <i class="fa-solid fa-graduation-cap text-success me-2"></i> 3. Education, Agriculture & Special Entitlements
            </h5>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label-gov">Education Level</label>
                <select id="prof-edu-level" class="form-select form-control-gov">
                  <option value="PRIMARY">Primary School</option>
                  <option value="SECONDARY">Secondary (10th)</option>
                  <option value="HIGHER_SECONDARY">Higher Secondary (12th)</option>
                  <option value="UNDERGRADUATE">Undergraduate Degree</option>
                  <option value="POSTGRADUATE">Postgraduate</option>
                  <option value="DIPLOMA">Diploma / ITI Technical</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label-gov">Active Student Enrollment</label>
                <div class="form-check form-switch mt-2">
                  <input class="form-check-input" type="checkbox" id="prof-is-student">
                  <label class="form-check-label small" for="prof-is-student">Currently Enrolled in School/College</label>
                </div>
              </div>
              <div class="col-md-4">
                <label class="form-label-gov">Agricultural Landholder Status</label>
                <div class="form-check form-switch mt-2">
                  <input class="form-check-input" type="checkbox" id="prof-is-farmer">
                  <label class="form-check-label small" for="prof-is-farmer">Cultivable Landholder / Farmer</label>
                </div>
              </div>
              <div class="col-md-4">
                <label class="form-label-gov">Land Size (in Acres)</label>
                <input type="number" step="0.1" id="prof-land-size" class="form-control form-control-gov" placeholder="2.5">
              </div>
              <div class="col-md-4">
                <label class="form-label-gov">Person with Disability (Divyangjan)</label>
                <div class="form-check form-switch mt-2">
                  <input class="form-check-input" type="checkbox" id="prof-is-disability">
                  <label class="form-check-label small" for="prof-is-disability">Holds 40%+ Disability UDID</label>
                </div>
              </div>
              <div class="col-md-4">
                <label class="form-label-gov">Senior Citizen (60+ Years)</label>
                <div class="form-check form-switch mt-2">
                  <input class="form-check-input" type="checkbox" id="prof-is-senior">
                  <label class="form-check-label small" for="prof-is-senior">Age 60 years or above</label>
                </div>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-3">
            <a href="dashboard.html" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-gov-primary px-4 py-2">
              <i class="fa-solid fa-floppy-disk me-1"></i> Save Profile Details
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = API.getCurrentUser();
      if (user) {
        document.getElementById('prof-name').value = user.fullName || '';
        document.getElementById('prof-email').value = user.email || '';
        document.getElementById('prof-mobile').value = user.mobile || '';
      }

      const res = await API.get('/profile');
      if (res && res.data) {
        const p = res.data;
        if (p.gender) document.getElementById('prof-gender').value = p.gender;
        if (p.areaType) document.getElementById('prof-area').value = p.areaType;
        if (p.pincode) document.getElementById('prof-pincode').value = p.pincode;
        if (p.address) document.getElementById('prof-address').value = p.address;
        if (p.annualFamilyIncome) document.getElementById('prof-income').value = p.annualFamilyIncome;
        if (p.employmentStatus) document.getElementById('prof-employment').value = p.employmentStatus;
        if (p.familySize) document.getElementById('prof-family-size').value = p.familySize;
        if (p.houseOwnership) document.getElementById('prof-house').value = p.houseOwnership;
        if (p.educationLevel) document.getElementById('prof-edu-level').value = p.educationLevel;
        if (p.studentStatus) document.getElementById('prof-is-student').checked = p.studentStatus;
        if (p.farmerStatus) document.getElementById('prof-is-farmer').checked = p.farmerStatus;
        if (p.landSizeAcres) document.getElementById('prof-land-size').value = p.landSizeAcres;
        if (p.disabilityStatus) document.getElementById('prof-is-disability').checked = p.disabilityStatus;
        if (p.seniorCitizenStatus) document.getElementById('prof-is-senior').checked = p.seniorCitizenStatus;

        const pct = p.completionPercentage || 80;
        document.getElementById('prof-completion-text').innerText = `${pct}%`;
        document.getElementById('prof-completion-bar').style.width = `${pct}%`;
      }

      document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          gender: document.getElementById('prof-gender').value,
          areaType: document.getElementById('prof-area').value,
          pincode: document.getElementById('prof-pincode').value,
          address: document.getElementById('prof-address').value,
          annualFamilyIncome: parseFloat(document.getElementById('prof-income').value || 0),
          employmentStatus: document.getElementById('prof-employment').value,
          familySize: parseInt(document.getElementById('prof-family-size').value || 1),
          houseOwnership: document.getElementById('prof-house').value,
          educationLevel: document.getElementById('prof-edu-level').value,
          studentStatus: document.getElementById('prof-is-student').checked,
          farmerStatus: document.getElementById('prof-is-farmer').checked,
          landSizeAcres: parseFloat(document.getElementById('prof-land-size').value || 0),
          disabilityStatus: document.getElementById('prof-is-disability').checked,
          seniorCitizenStatus: document.getElementById('prof-is-senior').checked
        };

        const updateRes = await API.put('/profile', payload);
        if (updateRes && updateRes.success) {
          App.showToast('Profile updated successfully!', 'success');
          if (updateRes.data && updateRes.data.completionPercentage) {
            const pct = updateRes.data.completionPercentage;
            document.getElementById('prof-completion-text').innerText = `${pct}%`;
            document.getElementById('prof-completion-bar').style.width = `${pct}%`;
          }
        } else {
          App.showToast('Profile saved.', 'success');
        }
      });
    });
  </script>
</body>
</html>
