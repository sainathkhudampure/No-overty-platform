<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error — 500</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="assets/css/styles.css" rel="stylesheet">

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
  <div class="card border-0 shadow-sm p-5 text-center bg-white" style="max-width: 500px;">
    <div class="text-warning mb-3" style="font-size: 4rem;">
      <i class="fa-solid fa-server"></i>
    </div>

    <div class="d-flex justify-content-center gap-2">
      <a href="index.html" class="btn btn-gov-primary"><i class="fa-solid fa-house me-1"></i> Return Home</a>
      <button class="btn btn-outline-secondary" onclick="window.location.reload()"><i class="fa-solid fa-rotate-right me-1"></i> Retry</button>
    </div>
  </div>

</html>
